[package]
name = "re-forge"
version = "0.1.0"
edition = "2024"

[dependencies]
# Binary Parsing & Loaders (Pure Rust)
goblin = "0.10.7"

# Instruction Decoding & Disassembly (Pure Rust)
yaxpeax-arch = "0.3"
yaxpeax-x86 = "2.2.0"
yaxpeax-arm = "0.5.0"

# Graph Modeling (Control Flow Graph)
petgraph = { workspace = true }

# Workspace Services & Serialization
knowledge = { path = "../../workspace/knowledge" }
vllm-client = { path = "../vllm-client" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
