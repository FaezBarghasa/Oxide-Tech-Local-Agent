[package]
name = "mcp-qemu-redox"
version = "0.1.0"
edition = "2021"

[dependencies]
rmcp = { version = "1.7.0", features = ["server", "transport-io"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["full"] }
tracing = "0.1"
regex = "1.10"

sandbox = { path = "../sandbox" }
config-loader = { path = "../config-loader" }
schemars = "1.2.1"
