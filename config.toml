# Oxide-Tech Local Agent OS — Central Configuration
# All model URLs, thresholds, and routing parameters live here.

[gateway]
# Milliseconds of round-trip latency before the router considers the online
# coder "too slow" and falls back to the local coder.
latency_threshold_ms = 2000
# cargo-check quality score [0.0 – 1.0] below which the current coder backend
# is marked "unsatisfying" and the other backend is tried instead.
quality_threshold = 0.85
# Maximum auto-healing retry attempts before returning FAILED.
max_retries = 5
host = "127.0.0.1"
port = 8080
udp_port = 8080

# ---------------------------------------------------------------------------
# THINKER MODEL
# Uses Gemma 4 (27B instruction-tuned) via the Google AI Studio free-tier API.
# The Gemini API exposes an OpenAI-compatible shim, so no extra code is needed.
#
# Free tier: 1,500 requests/day, 32k context window.
# Set GEMINI_API_KEY in your environment (get one at aistudio.google.com).
#
# OFFLINE FALLBACK: if you want a fully local thinker with no API key, change
# provider to "ollama" and model to "gemma3:27b" or "qwen2.5-coder:32b-instruct-q4_K_M".
# ---------------------------------------------------------------------------
[thinker]
provider = "google"
model = "gemma-4-27b-it"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"

# ---------------------------------------------------------------------------
# ONLINE CODER — PRIMARY
# Groq free tier: 30 RPM / 14,400 tokens-per-minute on llama-3.3-70b-versatile.
# Set GROQ_API_KEY in your environment.
# ---------------------------------------------------------------------------
[coder.online.primary]
provider = "groq"
model = "llama-3.3-70b-versatile"
base_url = "https://api.groq.com/openai/v1"

