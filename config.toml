# ---------------------------------------------------------------------------
# ONLINE CODER — SECONDARY FALLBACK
# Mistral Le Chat free tier (codestral-latest).
# Set MISTRAL_API_KEY in your environment.
# ---------------------------------------------------------------------------
[coder.online.secondary]
provider = "mistral"
model = "codestral-latest"
base_url = "https://api.mistral.ai/v1"

# ---------------------------------------------------------------------------
# LOCAL CODER
# Ollama-served local model. Used when offline or when online quality is poor.
# ---------------------------------------------------------------------------
[coder.local]
provider = "ollama"
model = "qwen2.5-coder:7b-instruct-q4_K_M"
base_url = "http://localhost:11434"

# ---------------------------------------------------------------------------
# RAG PIPELINE
# ---------------------------------------------------------------------------
[rag]
# Qdrant collection that stores embedded Rust crate docs + AST chunks.
collection = "rust_rag"
# Number of top-k chunks retrieved per query.
top_k = 8
# Automatically re-ingest updated crate docs on startup.
auto_update_on_startup = true
# Crates whose docs.rs pages are monitored for version bumps and re-indexed.
watchlist = [
    "embedded-hal",
    "embassy-executor",
    "embassy-time",
    "embassy-stm32",
    "embassy-nrf",
    "rtic",
    "cortex-m",
    "cortex-m-rt",
    "defmt",
    "probe-rs",
    "heapless",
    "nb",
    "stm32-hal2",
    "nrf-hal-common",
    "esp-hal",
    "rp2040-hal",
]

# ---------------------------------------------------------------------------
# MCP SERVER
# ---------------------------------------------------------------------------
[mcp]
# Transport used by the MCP server binary (stdio | tcp).
transport = "stdio"
# Port used when transport = "tcp".
tcp_port = 9090

[mcp.cargo_gatekeeper]
medical_device_mode = true
forbid_unsafe_in_workspace = true
whitelisted_unsafe_crates = ["cortex-m", "cortex-m-rt", "stm32f4xx-hal", "nix"]

[mcp.probe_rs]
default_chip = "STM32F411CE"
hitl_socket_path = "/tmp/oxide-hitl.sock"
hitl_timeout_secs = 120

[mcp.qemu_redox]
qemu_binary = "qemu-system-x86_64"
default_memory_mb = 512
images_dir = "target/qemu"
serial_capture_timeout_secs = 30

[mcp.live_docs]
cache_ttl_minutes = 60
max_concurrent_fetches = 4
rate_limit_delay_ms = 1000

# ---------------------------------------------------------------------------
# AUTHENTICATION
# ---------------------------------------------------------------------------
[auth]
jwt_secret = "eios_secret_key_change_me_in_production"
jwt_expiration_hours = 24

