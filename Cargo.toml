[workspace]
members = [
    "crates/oxide-core",
    "crates/oxide-state",
    "crates/oxide-engines",
    "crates/oxide-security",
    "crates/gateway",
    "crates/thinker",
    "crates/memory",
    "crates/router",
    "crates/verifier",
    "crates/knowledge",
    "crates/skills",
    "crates/mcp-clients",
    "crates/common",
    "crates/mcp-server",
    "crates/blog",
    "crates/scheduler",
    "crates/api",
    "crates/config-loader",
    "crates/gateway-router",
    "crates/qdrant-service",
    "crates/rag-pipeline",
    "crates/sandbox",
    "crates/surrealdb-service",
    "crates/tree-sitter-service",
    "crates/vllm-client",
    "crates/mcp-cargo-gatekeeper",
    "crates/mcp-probe-rs",
    "crates/mcp-qemu-redox",
    "crates/mcp-live-docs",
    "crates/self-evolver",
    "crates/optio",
    "crates/agent-journal",
    "crates/telemetry",
    "crates/benchmark-harness",
    "crates/crucible",
    "crates/formal-verify",
    "crates/wasm-forge",
    "crates/edge-swarm",
    "crates/ebpf-sentinel",
    "crates/cad-forge",
    "crates/circuit-forge",
    "crates/web-forge",
    "crates/scene-forge",
    "crates/parametric-forge",
    "crates/visual-forge",
    "crates/re-forge",
    "crates/oxide-protocol",
    "crates/cross-domain-verifier",
    "crates/model-trainer",
    "crates/surface-api",
    "crates/ratchet",
    "crates/forge-rust",
    "targets/llm-pretraining-rs/surface",
    "targets/llm-pretraining-rs/harness",
    "src-tauri",
]

resolver = "3"


[workspace.dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-io"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1"
anyhow = "1.0"
actix-web = { version = "4.13", default-features = false, features = [
    "macros",
    "compress-gzip",
    "compress-zstd",
    "http2",
    "cookies",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# reqwest dependency moved to workspace.dependencies
syn = { version = "3.0.5", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
fastembed = "7.0.1"
notify = "8.0"
uuid = { version = "1.23", features = ["v4", "v5", "v7", "serde"] }
blake3 = "1.5"
futures-util = "0.3"
select = "0.6"
similar = "3.2.0"
surrealdb = { version = "3", features = [
    "kv-surrealkv",
    "kv-mem",
    "protocol-ws",
] }
surrealdb-types = "3.1.5"
regex = "1"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["json"] }
qdrant-client = "1.13"
chrono = { version = "0.4.39", features = ["serde"] }
prometheus = "0.14.0"
quinn = "0.11"
h3 = "0.0.8"
h3-quinn = "0.0.10"
rustls = { version = "0.23", features = ["ring"] }
toml = "1.1.2"
thiserror = "2.0"
nix = { version = "0.31.3", features = ["signal", "process", "resource"] }

dashmap = "6.1"
polars = { version = "0.55.2", default-features = false, features = [
    "lazy",
    "json",
] }
argon2 = "0.6.0"
mdns-sd = "0.21.3"
sysinfo = "0.39.6"
actix-web-lab = "0.27.0"

ndarray = "0.17.2"
petgraph = { version = "0.8.3", features = ["serde-1"] }
lru = "0.18.4"
safetensors = "0.8.0"
memmap2 = "0.9"
# --- 5-Pillar Ascension Dependencies ---
rkyv = { version = "0.8", features = ["bytecheck", "std"] }
rayon = "1.10"
postcard = { version = "1.0", features = ["alloc"] }
wasmtime = { version = "48.0.1", features = ["async", "cranelift"] }
wat = "1.220"
rumqttc = "0.25"
mqtt-async-embedded = { git = "https://github.com/FaezBarghasa/mqtt-async-embedded" }
miette = { version = "7.2", features = ["fancy"] }
glam = { version = "0.33.7", features = ["std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
libloading = "0.9.0"
parametric-forge = { path = "crates/parametric-forge" }
visual-forge = { path = "crates/visual-forge" }
forge-rust = { path = "crates/forge-rust" }


[profile.release]
opt-level = 3       # Enable maximum performance optimizations
lto = "thin"        # Fast Link-Time Optimization without OOM exhaustion
codegen-units = 16  # Parallelize compilation and linking within memory budget
panic = "unwind"    # Required for catch_unwind FFI fault boundary isolation
strip = "debuginfo" # Strip debuginfo while preserving panic unwinding tables
incremental = false

[profile.surface]
inherits = "release"
lto = "thin"         # Fast incremental linking for mutable surface candidate
codegen-units = 16   # Parallelize codegen units for sub-second compile latency
incremental = true   # Warm incremental cache
opt-level = 3
debug = false
