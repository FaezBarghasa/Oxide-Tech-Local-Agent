services:
  # ----------------------------------------------------------------------------
  # SurrealDB - Dual Graph & Time-Series State Storage
  # ----------------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v2.2.1
    container_name: oxide-surrealdb
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: start --user root --pass root --bind 0.0.0.0:8000 rocksdb:/var/lib/surrealdb/data
    volumes:
      - surrealdb_data:/var/lib/surrealdb/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Qdrant - High-Dimensional AST & Code Vector Database
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: oxide-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # Ollama - Local-First Quantized Inference Fallback (Single-GPU / CPU)
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: oxide-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU support (NVIDIA driver on Linux / Pop!_OS)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  surrealdb_data:
  qdrant_data:
  ollama_models:
