<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img">
  <title>Oxide-Tech Symbol</title>
  <desc>
    Octagon-O + X Cross: an octagonal pad standing in for the letter O,
    crossed by two 45-degree diagonal traces forming the letter X, with
    vias at all four corners and at the center junction. Built entirely
    from standard PCB pad, trace, and via primitives.
  </desc>

  <defs>
    <style>
      svg {
        --trace-color: #C1552C;
        --via-bg: #0A0E14;
        --via-ring: #C1552C;
      }
      .trace {
        stroke: var(--trace-color);
        stroke-width: 4.5;
        stroke-linecap: round;
        fill: none;
      }
      .via-outer {
        fill: var(--via-bg);
        stroke: var(--via-ring);
      }
      .via-inner {
        fill: var(--via-ring);
      }
    </style>

    <!-- Reusable via, positioned via <use> -->
    <g id="via-lg">
      <circle class="via-outer" r="6" stroke-width="3"/>
      <circle class="via-inner" r="2.2"/>
    </g>
  </defs>

  <!-- X: full 45° diagonals of the bounding box -->
  <line x1="20" y1="20" x2="80" y2="80" class="trace"/>
  <line x1="80" y1="20" x2="20" y2="80" class="trace"/>

  <!-- O: standard octagon pad shape (chamfered square) -->
  <polygon points="43,35 57,35 65,43 65,57 57,65 43,65 35,57 35,43"
    fill="var(--via-bg)" stroke="var(--trace-color)" stroke-width="4"/>

  <!-- Corner vias where X legs terminate -->
  <use href="#via-lg" x="20" y="20"/>
  <use href="#via-lg" x="80" y="20"/>
  <use href="#via-lg" x="80" y="80"/>
  <use href="#via-lg" x="20" y="80"/>

  <!-- Center via where X crosses, inside the O -->
  <g transform="translate(50,50)">
    <circle class="via-outer" r="4" stroke-width="2"/>
    <circle class="via-inner" r="1.4"/>
  </g>
</svg>
