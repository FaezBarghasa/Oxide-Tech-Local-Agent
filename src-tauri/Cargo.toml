[package]
name = "oxide-tech-local-agent"
version = "0.5.0"
edition = "2024"
description = "Oxide-Tech Local Agent OS — single-binary Tauri desktop (embedded gateway + oxide-embed memory + studio UI)"
license = "MIT"
authors = ["Oxide-Tech Systems Engineering"]
homepage = "https://github.com/FaezBarghasa/Oxide-Tech-Local-Agent"
repository = "https://github.com/FaezBarghasa/Oxide-Tech-Local-Agent"
rust-version = "1.85"
default-run = "oxide-tech-local-agent"

[[bin]]
name = "oxide-tech-local-agent"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-opener = "2"
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { workspace = true }
toml = { workspace = true }
oxide-gateway = { path = "../crates/oxide-gateway" }
common = { path = "../crates/common" }
re-forge = { path = "../crates/re-forge" }
verifier = { path = "../crates/verifier" }
config-loader = { path = "../crates/config-loader" }
model-trainer = { path = "../crates/model-trainer" }
agent-journal = { path = "../crates/agent-journal" }
oxide-kernels = { path = "../crates/oxide-kernels" }
audio-forge = { path = "../crates/audio-forge" }
media-forge = { path = "../crates/media-forge" }
oxide-updater = { path = "../crates/oxide-updater" }
base64 = { workspace = true }
select = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
mimalloc = { version = "0.1.39", default-features = false, features = ["secure"] }
probe-rs = { version = "0.32", features = ["default"], optional = true }
sysinfo = { workspace = true }

[features]
default = []
probe-rs = ["dep:probe-rs"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[test]]
name = "pure_rust_stack_test"
path = "../tests/pure_rust_stack_test.rs"

[dev-dependencies]
edge-swarm = { path = "../crates/edge-swarm" }
mcp-probe-rs = { path = "../crates/mcp-probe-rs" }
oxide-engines = { path = "../crates/oxide-engines" }
qdrant-service = { path = "../crates/qdrant-service" }
surrealdb-service = { path = "../crates/surrealdb-service" }

# Release tuning (opt-level, LTO, strip) is inherited from the workspace root
# [profile.release]; per-package profiles are ignored in a workspace.
